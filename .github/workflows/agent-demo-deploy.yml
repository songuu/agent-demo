name: Deploy Agent Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_agent_platform_single_node:
        description: Deploy the constrained Agent Platform profile to the SPIFFE host
        required: false
        default: false
        type: boolean

concurrency:
  group: agent-demo-production
  cancel-in-progress: false

permissions:
  contents: read

# Node app deploy: quality gates -> SSH setup -> scripts/deploy-production.mjs --apply.
# Reference shape: agent-build .github/workflows/agent-build-deploy.yml.
# Required GH secret: AGENT_DEMO_SSH_PRIVATE_KEY.
# Optional secrets with defaults: AGENT_DEMO_DEPLOY_HOST, AGENT_DEMO_DEPLOY_USER, AGENT_DEMO_DOMAIN.
jobs:
  build-and-deploy:
    name: Build and deploy (agent-demo apps)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NODE_VERSION: "22"
      PNPM_VERSION: "10.12.4"
      DEPLOY_HOST: ${{ secrets.AGENT_DEMO_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.AGENT_DEMO_DEPLOY_USER }}
      DOMAIN: ${{ secrets.AGENT_DEMO_DOMAIN }}
      SSH_PRIVATE_KEY: ${{ secrets.AGENT_DEMO_SSH_PRIVATE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set deployment defaults
        run: |
          set -euo pipefail
          deploy_host="${DEPLOY_HOST:-47.253.230.197}"
          deploy_user="${DEPLOY_USER:-root}"
          domain="${DOMAIN:-songuu.top}"
          deploy_branch="${GITHUB_REF_NAME:-main}"
          repository_url="https://github.com/${GITHUB_REPOSITORY}.git"
          echo "DEPLOY_HOST=${deploy_host}" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=${deploy_user}" >> "$GITHUB_ENV"
          echo "DEPLOY_TARGET=${deploy_user}@${deploy_host}" >> "$GITHUB_ENV"
          echo "DOMAIN=${domain}" >> "$GITHUB_ENV"
          echo "DEPLOY_BRANCH=${deploy_branch}" >> "$GITHUB_ENV"
          echo "REPOSITORY_URL=${repository_url}" >> "$GITHUB_ENV"
          echo "BASE_PATH=/agent-demo/spiffe" >> "$GITHUB_ENV"
          echo "PORT=5173" >> "$GITHUB_ENV"

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "::error::Missing required GitHub secret AGENT_DEMO_SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Enable pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.8.4"
          enable-cache: true
          cache-dependency-glob: apps/agent-platform/uv.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Agent platform dependencies
        working-directory: apps/agent-platform
        run: uv sync --frozen --extra dev

      - name: Run Agent platform static gates
        run: |
          set -euo pipefail
          pnpm --filter @agent-demo/agent-platform lint
          pnpm --filter @agent-demo/agent-platform format:check

      - name: Validate Agent platform OPA policies
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace/apps/agent-platform \
            openpolicyagent/opa:1.5.1-static@sha256:72c5186ef74bc7a88faf88204109476be41cdc392ff1de722f7d8ecb08f18c4d \
            check --strict policies
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace/apps/agent-platform \
            openpolicyagent/opa:1.5.1-static@sha256:72c5186ef74bc7a88faf88204109476be41cdc392ff1de722f7d8ecb08f18c4d \
            test policies tests/policy

      - name: Run quality gates
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm apps:list

      - name: Run Agent platform offline release eval
        working-directory: apps/agent-platform
        run: |
          set -euo pipefail
          uv run --frozen python evals/run_release_evals.py \
            --mode offline \
            --output ../../.artifacts/agent-platform/offline-release-evals.json

      - name: Upload Agent platform eval evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agent-platform-offline-release-evals
          path: .artifacts/agent-platform/offline-release-evals.json
          if-no-files-found: warn
          retention-days: 30

      - name: Build self-check
        run: |
          set -euo pipefail
          BASE_PATH="${BASE_PATH}" PORT="${PORT}" node - <<'NODE'
          const demo = require("./apps/spiffe-mtls-agent/dist/src/web/demo-model.js");
          const snapshot = demo.getDemoSnapshot("127.0.0.1", Number(process.env.PORT), process.env.BASE_PATH);
          if (snapshot.basePath !== process.env.BASE_PATH) {
            throw new Error(`basePath mismatch: ${snapshot.basePath}`);
          }
          if (snapshot.steps.length !== 8) {
            throw new Error(`expected 8 demo steps, got ${snapshot.steps.length}`);
          }
          console.log(`snapshot-ok=${snapshot.steps.length}`);
          NODE

      - name: Deploy dry run
        run: |
          set -euo pipefail
          pnpm deploy:prod -- \
            --deploy-host "${DEPLOY_TARGET}" \
            --domain "${DOMAIN}" \
            --repository-url "${REPOSITORY_URL}" \
            --branch "${DEPLOY_BRANCH}"
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/agent_demo_deploy_key
          chmod 600 ~/.ssh/agent_demo_deploy_key
          ssh-keyscan -T 10 -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            IdentityFile ~/.ssh/agent_demo_deploy_key
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy production
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.deploy_agent_platform_single_node }}
        run: |
          set -euo pipefail
          pnpm deploy:prod -- \
            --apply \
            --deploy-host "${DEPLOY_TARGET}" \
            --domain "${DOMAIN}" \
            --repository-url "${REPOSITORY_URL}" \
            --branch "${DEPLOY_BRANCH}"

      - name: Verify production
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.deploy_agent_platform_single_node }}
        run: |
          set -euo pipefail
          health_json="$(ssh -i ~/.ssh/agent_demo_deploy_key -o BatchMode=yes "${DEPLOY_TARGET}" "curl -fsS http://127.0.0.1:${PORT}${BASE_PATH}/healthz")"
          echo "${health_json}"
          echo "${health_json}" | grep -q '"ok": true'

          for path in "${BASE_PATH}/" "${BASE_PATH}/assets/spiffe-agent-mtls-complete-architecture.svg"; do
            code="$(curl -k -L -s -o /dev/null -w '%{http_code}' "https://${DOMAIN}${path}")"
            echo "public https://${DOMAIN}${path} -> ${code}"
            test "${code}" = "200"
          done
          echo "agent-demo production verified"

      - name: Deploy Agent Platform constrained single-node profile
        if: inputs.deploy_agent_platform_single_node
        run: |
          set -euo pipefail
          spiffe_before_code="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            "https://${DOMAIN}/agent-demo/spiffe/")"
          test "${spiffe_before_code}" = "200"
          spiffe_before_architecture_code="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            "https://${DOMAIN}/agent-demo/spiffe/assets/spiffe-agent-mtls-complete-architecture.svg")"
          test "${spiffe_before_architecture_code}" = "200"
          pnpm deploy:agent-platform:single-node -- \
            --apply \
            --deploy-host "${DEPLOY_TARGET}" \
            --domain "${DOMAIN}" \
            --repository-url "${REPOSITORY_URL}" \
            --branch "${DEPLOY_BRANCH}" \
            --git-sha "${GITHUB_SHA}"

      - name: Verify Agent Platform constrained single-node profile
        if: inputs.deploy_agent_platform_single_node
        run: |
          set -euo pipefail
          public_base_url="https://${DOMAIN}/agent-demo/agent-platform"
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "${verification_dir}"' EXIT

          local_health="$(ssh -i ~/.ssh/agent_demo_deploy_key -o BatchMode=yes "${DEPLOY_TARGET}" \
            "curl -fsS http://127.0.0.1:5181/health")"
          echo "${local_health}" | grep -Fq "\"release_git_sha\":\"${GITHUB_SHA}\""
          echo "${local_health}" | grep -Eq '"release_image_digest":"sha256:[0-9a-f]{64}"'

          local_ready_response="$(ssh -i ~/.ssh/agent_demo_deploy_key -o BatchMode=yes \
            "${DEPLOY_TARGET}" "curl -sS -w '\n%{http_code}' http://127.0.0.1:5181/ready")"
          local_ready_code="${local_ready_response##*$'\n'}"
          local_ready_body="${local_ready_response%$'\n'*}"
          test "${local_ready_code}" = "503"
          echo "${local_ready_body}" | \
            grep -Fq '"artifact_malware_scanner":"error:policy-fail-closed:structural-only"'

          read -r root_code root_content_type < <(
            curl --silent --show-error \
              --dump-header "${verification_dir}/index.headers" \
              --output "${verification_dir}/index.html" \
              --write-out '%{http_code} %{content_type}\n' \
              "${public_base_url}/"
          )
          echo "public ${public_base_url}/ -> ${root_code} ${root_content_type}"
          test "${root_code}" = "200"
          case "${root_content_type}" in
            text/html*) ;;
            *)
              echo "::error::Unexpected Agent Platform root content type: ${root_content_type}"
              exit 1
              ;;
          esac
          grep -Fq 'data-agent-platform-shell="v1"' "${verification_dir}/index.html"
          tr -d '\r' < "${verification_dir}/index.headers" > \
            "${verification_dir}/index.headers.normalized"
          root_headers="${verification_dir}/index.headers.normalized"
          grep -Eiq "^content-security-policy:.*default-src 'none'" "${root_headers}"
          grep -Eiq "^content-security-policy:.*script-src 'self'" "${root_headers}"
          grep -Eiq "^content-security-policy:.*style-src 'self'" "${root_headers}"
          grep -Eiq "^content-security-policy:.*connect-src 'self'" "${root_headers}"
          grep -Eiq '^x-frame-options:[[:space:]]*DENY[[:space:]]*$' "${root_headers}"
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff[[:space:]]*$' "${root_headers}"
          grep -Eiq '^referrer-policy:[[:space:]]*no-referrer[[:space:]]*$' "${root_headers}"
          grep -Eiq '^cache-control:.*no-store' "${root_headers}"

          read -r css_code css_content_type < <(
            curl --silent --show-error \
              --output "${verification_dir}/app.css" \
              --write-out '%{http_code} %{content_type}\n' \
              "https://${DOMAIN}/agent-demo/agent-platform/assets/app.css"
          )
          echo "public https://${DOMAIN}/agent-demo/agent-platform/assets/app.css -> ${css_code} ${css_content_type}"
          test "${css_code}" = "200"
          case "${css_content_type}" in
            text/css*) ;;
            *)
              echo "::error::Unexpected Agent Platform CSS content type: ${css_content_type}"
              exit 1
              ;;
          esac

          read -r js_code js_content_type < <(
            curl --silent --show-error \
              --output "${verification_dir}/app.js" \
              --write-out '%{http_code} %{content_type}\n' \
              "https://${DOMAIN}/agent-demo/agent-platform/assets/app.js"
          )
          echo "public https://${DOMAIN}/agent-demo/agent-platform/assets/app.js -> ${js_code} ${js_content_type}"
          test "${js_code}" = "200"
          case "${js_content_type}" in
            application/javascript*) ;;
            *)
              echo "::error::Unexpected Agent Platform JavaScript content type: ${js_content_type}"
              exit 1
              ;;
          esac

          public_health_code="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' "${public_base_url}/health")"
          echo "public ${public_base_url}/health -> ${public_health_code}"
          test "${public_health_code}" = "200"

          public_ready_response="$(curl --silent --show-error \
            --write-out '\n%{http_code}' "${public_base_url}/ready")"
          ready_code="${public_ready_response##*$'\n'}"
          ready_body="${public_ready_response%$'\n'*}"
          echo "public ${public_base_url}/ready -> ${ready_code}"
          test "${ready_code}" = "503"
          echo "${ready_body}" | \
            grep -Fq '"artifact_malware_scanner":"error:policy-fail-closed:structural-only"'

          for denied_path in \
            "/v1/runs" \
            "/v1/models" \
            "/openapi.json" \
            "/docs" \
            "/redoc" \
            "/metrics"; do
            denied_code="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              --header 'X-Agent-Roles: admin' \
              "${public_base_url}${denied_path}")"
            echo "public ${public_base_url}${denied_path} -> ${denied_code}"
            test "${denied_code}" = "404"
          done

          spiffe_after_code="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            "https://${DOMAIN}/agent-demo/spiffe/")"
          test "${spiffe_after_code}" = "200"
          spiffe_after_architecture_code="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            "https://${DOMAIN}/agent-demo/spiffe/assets/spiffe-agent-mtls-complete-architecture.svg")"
          test "${spiffe_after_architecture_code}" = "200"
          echo "agent-platform constrained profile deployed; known scanner readiness block preserved"
