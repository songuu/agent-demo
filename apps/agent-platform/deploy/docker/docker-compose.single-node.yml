# DEVELOPMENT / SINGLE-NODE EXCEPTION ONLY.
#
# This override exists solely for the currently constrained 2-vCPU host. It
# preserves the complete local dependency graph while bounding resource use.
# It is not staging or production, provides no HA or managed-service controls,
# and must never be used as production-release evidence.
#
# Merge this file after docker-compose.yml and provide every required
# AGENT_PLATFORM_SINGLE_NODE_* value from a protected environment file.
name: agent-platform-single-node

x-single-node-labels: &single-node-labels
  com.songuu.agent-platform.deployment-mode: single-node-development-only

x-release-environment: &release-environment
  # The constrained local MinIO image has no KMS backend; Settings rejects this outside dev.
  AGENT_ARTIFACT_ALLOW_UNENCRYPTED_LOCAL: "true"
  AGENT_RELEASE_GIT_SHA: ${AGENT_PLATFORM_RELEASE_GIT_SHA:?AGENT_PLATFORM_RELEASE_GIT_SHA is required}
  AGENT_RELEASE_IMAGE_DIGEST: ${AGENT_PLATFORM_RELEASE_IMAGE_DIGEST:?AGENT_PLATFORM_RELEASE_IMAGE_DIGEST is required}

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
    ports: !override
      - "127.0.0.1:15432:5432"
    labels: *single-node-labels
    cpus: 0.30
    mem_limit: 192m
    memswap_limit: 384m

  redis:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:16379:6379"
    labels: *single-node-labels
    cpus: 0.10
    mem_limit: 64m
    memswap_limit: 128m

  temporal:
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER is required}
      POSTGRES_PWD: ${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD is required}
    ports: !override
      - "127.0.0.1:17233:7233"
    labels: *single-node-labels
    cpus: 0.35
    mem_limit: 288m
    memswap_limit: 576m

  minio:
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_USER:?AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_PASSWORD:?AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_PASSWORD is required}
    ports: !override
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    labels: *single-node-labels
    cpus: 0.20
    mem_limit: 160m
    memswap_limit: 320m

  minio-init:
    environment:
      MINIO_ROOT_USER: ${AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_USER:?AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_PASSWORD:?AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_PASSWORD is required}
    entrypoint: !override
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing --with-lock local/agent-platform-local
        mc version enable local/agent-platform-local
        mc mb --ignore-existing local/agent-platform-local-staging
        mc ilm rule add --expire-days 1 local/agent-platform-local-staging || true
    labels: *single-node-labels
    cpus: 0.05
    mem_limit: 64m
    memswap_limit: 128m

  opa:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:18181:8181"
    labels: *single-node-labels
    cpus: 0.10
    mem_limit: 64m
    memswap_limit: 128m

  migration:
    image: ${AGENT_PLATFORM_IMAGE:-agent-platform:single-node}
    build: !reset null
    pull_policy: never
    environment:
      AGENT_DATABASE_URL: postgresql+asyncpg://${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER is required}:${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD is required}@postgres/agent_platform
    labels: *single-node-labels
    cpus: 0.10
    mem_limit: 128m
    memswap_limit: 256m

  webhook-secret-init:
    image: ${AGENT_PLATFORM_IMAGE:-agent-platform:single-node}
    build: !reset null
    pull_policy: never
    labels: *single-node-labels
    cpus: 0.05
    mem_limit: 32m
    memswap_limit: 64m

  agent-api:
    restart: unless-stopped
    image: ${AGENT_PLATFORM_IMAGE:-agent-platform:single-node}
    build: !reset null
    pull_policy: never
    environment:
      <<: *release-environment
      AGENT_ENVIRONMENT: dev
      AGENT_ARTIFACT_MALWARE_SCAN_MODE: structural_only
      AGENT_DATABASE_DSN: postgresql+asyncpg://${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER is required}:${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD is required}@postgres/agent_platform
      AGENT_MANAGEMENT_DATABASE_DSN: postgresql+asyncpg://${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER is required}:${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD is required}@postgres/agent_platform
      AGENT_QUOTA_KEY_HMAC_SECRET: ${AGENT_PLATFORM_SINGLE_NODE_QUOTA_HMAC_SECRET:?AGENT_PLATFORM_SINGLE_NODE_QUOTA_HMAC_SECRET is required}
      AWS_ACCESS_KEY_ID: ${AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_USER:?AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_PASSWORD:?AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=12)",
        ]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 5
    ports: !override
      - "127.0.0.1:5181:8080"
    labels: *single-node-labels
    cpus: 0.20
    mem_limit: 192m
    memswap_limit: 384m

  agent-worker:
    restart: unless-stopped
    image: ${AGENT_PLATFORM_IMAGE:-agent-platform:single-node}
    build: !reset null
    pull_policy: never
    environment:
      <<: *release-environment
      AGENT_ENVIRONMENT: dev
      AGENT_DATABASE_DSN: postgresql+asyncpg://${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER is required}:${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD is required}@postgres/agent_platform
      AGENT_MAX_CONCURRENT_ACTIVITIES: "1"
      AGENT_TEMPORAL_WORKER_VERSIONING_ENABLED: "false"
      AWS_ACCESS_KEY_ID: ${AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_USER:?AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_PASSWORD:?AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/ready', timeout=12)",
        ]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 5
    labels: *single-node-labels
    cpus: 0.20
    mem_limit: 192m
    memswap_limit: 384m

  commit-worker:
    restart: unless-stopped
    image: ${AGENT_PLATFORM_IMAGE:-agent-platform:single-node}
    build: !reset null
    pull_policy: never
    environment:
      <<: *release-environment
      AGENT_ENVIRONMENT: dev
      AGENT_DATABASE_DSN: postgresql+asyncpg://${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER is required}:${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD is required}@postgres/agent_platform
      AGENT_MAX_CONCURRENT_ACTIVITIES: "1"
      AGENT_TEMPORAL_WORKER_VERSIONING_ENABLED: "false"
      AWS_ACCESS_KEY_ID: ${AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_USER:?AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_PASSWORD:?AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/ready', timeout=12)",
        ]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 5
    labels: *single-node-labels
    cpus: 0.15
    mem_limit: 160m
    memswap_limit: 320m

  outbox-worker:
    restart: unless-stopped
    image: ${AGENT_PLATFORM_IMAGE:-agent-platform:single-node}
    build: !reset null
    pull_policy: never
    environment:
      <<: *release-environment
      AGENT_ENVIRONMENT: dev
      AGENT_DATABASE_DSN: postgresql+asyncpg://${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER is required}:${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD is required}@postgres/agent_platform
      AGENT_WEBHOOK_WORKER_BATCH_SIZE: "1"
    labels: *single-node-labels
    cpus: 0.10
    mem_limit: 96m
    memswap_limit: 192m

  retention-worker:
    restart: unless-stopped
    image: ${AGENT_PLATFORM_IMAGE:-agent-platform:single-node}
    build: !reset null
    pull_policy: never
    entrypoint: !override
      - /bin/sh
      - -ec
      - while true; do agent-platform-retention; sleep 86400; done
    environment:
      <<: *release-environment
      AGENT_ENVIRONMENT: dev
      AGENT_DATABASE_DSN: postgresql+asyncpg://${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_USER is required}:${AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD:?AGENT_PLATFORM_SINGLE_NODE_POSTGRES_PASSWORD is required}@postgres/agent_platform
      AWS_ACCESS_KEY_ID: ${AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_USER:?AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_PASSWORD:?AGENT_PLATFORM_SINGLE_NODE_MINIO_ROOT_PASSWORD is required}
    labels: *single-node-labels
    cpus: 0.10
    mem_limit: 128m
    memswap_limit: 256m
